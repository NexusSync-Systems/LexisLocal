AWSTemplateFormatVersion: '2010-09-09'
Description: >
  LexisLocal — přístup ke Claude přes Amazon Bedrock JEN v EU (vlastní účet AWS kanceláře).
  Vytvoří IAM uživatele bez klíče (klíč si správce vytvoří v konzoli), politiku jen na volání
  jednoho modelu Claude přes EU inference profil (parametr ModelId; + reranker výsledků v EU) a explicitní zákaz Bedrocku mimo eu-* regiony,
  plus měsíční rozpočet s upozorněním e-mailem. Spouštějte v regionu eu-central-1.

Parameters:
  NazevUzivatele:
    Type: String
    Default: lexislocal-bedrock
    Description: IAM uživatel, pod kterým LexisLocal volá Bedrock (klíč vytvoříte ručně v konzoli IAM).
  MesicniRozpocetUSD:
    Type: Number
    Default: 100
    MinValue: 1
    Description: Měsíční rozpočet na Bedrock v USD (upozornění při 80 % a 100 %).
  EmailUpozorneni:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    Description: E-mail správce kanceláře pro upozornění na rozpočet.
  CteniNakladu:
    Type: String
    Default: ano
    AllowedValues: [ano, ne]
    Description: >
      Smí LexisLocal číst náklady účtu (Cost Explorer) pro porovnání odhadu s fakturou? „ano“ ve vlastním účtu
      kanceláře; „ne“ pro pilot v účtu dodavatele (klíč na Macu advokáta by jinak viděl náklady celého účtu).

  TvrdyStropVAWS:
    Type: String
    Default: ne
    AllowedValues: [ano, ne]
    Description: >
      „ano“ = při vyčerpání StropClaudeUSD AWS uživateli automaticky zakáže Bedrock (AWS Budgets action) — skutečný
      strop i pro případ odcizeného klíče. Počítá útratu za Clauda v celém účtu (Budgets neumí rozlišit uživatele).
  ModelId:
    Type: String
    Default: eu.anthropic.claude-sonnet-4-6
    AllowedPattern: '^eu\.anthropic\.[a-z0-9.-]+$'
    Description: >
      Jediný model Claude (EU inference profil), který uživatel smí volat — revize 2. 11. 2026: s odcizeným klíčem
      nejde volat dražší model mimo strop rozpočtu.
  SluzbaVeVyuctovani:
    Type: String
    Default: 'Claude Sonnet 4.6 (Amazon Bedrock Edition)'
    Description: Název služby, pod kterým AWS účtuje zvolený model (Cost Explorer) — pro tvrdý strop.
  StropClaudeUSD:
    Type: Number
    Default: 50
    MinValue: 1
    Description: Měsíční strop útraty za Clauda / Bedrock v USD, po kterém AWS uživateli zakáže Bedrock (jen s TvrdyStropVAWS=ano).

Conditions:
  SNaklady: !Equals [!Ref CteniNakladu, ano]
  SeStropem: !Equals [!Ref TvrdyStropVAWS, ano]

Resources:
  BedrockEuPolitika:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: LexisLocal - jen Claude pres Bedrock v EU
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: VolaniClaudePresEuProfil
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource:
              - !Sub 'arn:aws:bedrock:eu-*:${AWS::AccountId}:inference-profile/${ModelId}'
              - !Sub ['arn:aws:bedrock:eu-*::foundation-model/${Zaklad}*', { Zaklad: !Select [1, !Split ['eu.', !Ref ModelId]] }]
            Condition:
              StringLike:
                aws:RequestedRegion: 'eu-*'
          - Sid: PrerazeniVysledkuVEU
            # Pilot jen cloud (1. 11. 2026): přeřazení výsledků vyhledávání (Bedrock Rerank) — dotaz a veřejné
            # pasáže zákonů a judikatury, nikdy úseky ze spisů (lib/rerank_service.js). Rerank potřebuje
            # bedrock:Rerank i bedrock:InvokeModel na modelu rerankeru. Cohere Rerank je model třetí strany
            # (AWS Marketplace) — předplatné jednou potvrdí správce účtu v konzoli Bedrock (Model access).
            Effect: Allow
            Action:
              - bedrock:Rerank
            Resource: '*'
            Condition:
              StringLike:
                aws:RequestedRegion: 'eu-*'
          - Sid: ModelRerankeruVEU
            Effect: Allow
            Action:
              - bedrock:InvokeModel
            Resource:
              - 'arn:aws:bedrock:eu-*::foundation-model/cohere.rerank-*'
              - 'arn:aws:bedrock:eu-*::foundation-model/amazon.rerank-*'
            Condition:
              StringLike:
                aws:RequestedRegion: 'eu-*'
          - Sid: CteniEuProfilu
            # Test před pilotem (backend/scripts/aws-pilot-test.js) ověří, že EU profil míří jen do EU regionů.
            Effect: Allow
            Action:
              - bedrock:GetInferenceProfile
            Resource:
              - !Sub 'arn:aws:bedrock:eu-*:${AWS::AccountId}:inference-profile/${ModelId}'
            Condition:
              StringLike:
                aws:RequestedRegion: 'eu-*'
          - !If
            - SNaklady
            # LexisLocal večer porovná svůj odhad nákladů s fakturací AWS (Cost Explorer, jen částky,
            # žádný obsah dotazů). Cost Explorer je globální služba s koncovým bodem us-east-1.
            # Pilot v účtu dodavatele: CteniNakladu=ne (náklady hlídá dodavatel, pilot-cloudshell.sh stav).
            - Sid: CteniNakladuProPorovnani
              Effect: Allow
              Action:
                - ce:GetCostAndUsage
              Resource: '*'
            - !Ref AWS::NoValue
          - Sid: ZakazMimoEU
            Effect: Deny
            Action: 'bedrock:*'
            Resource: '*'
            Condition:
              StringNotLike:
                aws:RequestedRegion: 'eu-*'
          - Sid: ZakazZmenyUkladaniDat
            # LexisLocal nesmí přepnout uchovávání dat Bedrocku na nic jiného než „none“ (nulové ukládání)
            Effect: Deny
            Action:
              - bedrock:PutAccountDataRetention
            Resource: '*'
            Condition:
              StringNotEquals:
                bedrock:DataRetentionMode: 'none'
          - Sid: ZakazGlobalnichAJinychProfilu
            Effect: Deny
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            NotResource:
              - !Sub 'arn:aws:bedrock:eu-*:${AWS::AccountId}:inference-profile/${ModelId}'
              - !Sub ['arn:aws:bedrock:eu-*::foundation-model/${Zaklad}*', { Zaklad: !Select [1, !Split ['eu.', !Ref ModelId]] }]
              - 'arn:aws:bedrock:eu-*::foundation-model/cohere.rerank-*'
              - 'arn:aws:bedrock:eu-*::foundation-model/amazon.rerank-*'

  LexisLocalUzivatel:
    Type: AWS::IAM::User
    Properties:
      UserName: !Ref NazevUzivatele
      ManagedPolicyArns:
        - !Ref BedrockEuPolitika
      Tags:
        - Key: aplikace
          Value: LexisLocal

  RozpocetBedrock:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${NazevUzivatele}-mesicni'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MesicniRozpocetUSD
          Unit: USD
        # Bez filtru služby: Claude se v Bedrocku účtuje i pod názvy „Claude … (Amazon Bedrock Edition)“,
        # které filtr „Amazon Bedrock“ nezachytí. Účet má sloužit jen LexisLocalu, rozpočet tedy hlídá celý účet.
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref EmailUpozorneni }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref EmailUpozorneni }]

  # --- Tvrdý strop v AWS (revize 2. 11. 2026): rozpočet jen za Clauda/Bedrock a při 100 % automaticky zákaz Bedrocku ---
  ZakazBedrockuPolitika:
    Type: AWS::IAM::ManagedPolicy
    Condition: SeStropem
    Properties:
      Description: LexisLocal - zakaz Bedrocku po vycerpani rozpoctu (pripojuje AWS Budgets)
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: StropRozpoctu
            Effect: Deny
            Action: 'bedrock:*'
            Resource: '*'

  RozpoctovaAkceRole:
    Type: AWS::IAM::Role
    Condition: SeStropem
    Properties:
      Description: AWS Budgets smi pripojit zakaz Bedrocku k uzivateli LexisLocalu
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: budgets.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: pripojit-zakaz
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:AttachUserPolicy
                  - iam:DetachUserPolicy
                Resource: !GetAtt LexisLocalUzivatel.Arn
                Condition:
                  ArnEquals:
                    iam:PolicyARN: !Ref ZakazBedrockuPolitika

  RozpocetClaudeStop:
    Type: AWS::Budgets::Budget
    Condition: SeStropem
    Properties:
      Budget:
        BudgetName: !Sub '${NazevUzivatele}-claude-strop'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref StropClaudeUSD
          Unit: USD
        # Názvy služeb, pod kterými AWS účtuje Clauda (ověřeno ve vyúčtování 10/2026) a Bedrock.
        CostFilters:
          Service:
            - !Ref SluzbaVeVyuctovani
            - 'Amazon Bedrock'
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref EmailUpozorneni }]

  RozpoctovaAkce:
    Type: AWS::Budgets::BudgetsAction
    Condition: SeStropem
    Properties:
      BudgetName: !Ref RozpocetClaudeStop
      NotificationType: ACTUAL
      ActionType: APPLY_IAM_POLICY
      ActionThreshold: { Type: PERCENTAGE, Value: 100 }
      ExecutionRoleArn: !GetAtt RozpoctovaAkceRole.Arn
      ApprovalModel: AUTOMATIC
      Definition:
        IamActionDefinition:
          PolicyArn: !Ref ZakazBedrockuPolitika
          Users: [!Ref LexisLocalUzivatel]
      Subscribers:
        - Type: EMAIL
          Address: !Ref EmailUpozorneni

Outputs:
  Uzivatel:
    Description: IAM uživatel pro LexisLocal — přístupový klíč vytvořte v konzoli IAM (Security credentials → Create access key → Application running outside AWS)
    Value: !Ref LexisLocalUzivatel
  Politika:
    Value: !Ref BedrockEuPolitika
