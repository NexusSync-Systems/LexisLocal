# Akce připnuté na commit (SHA), instalace z lockfile (npm ci), token jen pro čtení, kde nejde o vydání
# (review 2, skupina 3 — dodavatelský řetězec). Novou verzi akce: git ls-remote --tags <repo> → SHA.
name: Build/Release LexisLocal

# Podepsaný + notarizovaný release. Spouští se JEN z tagu v* (jeden běh, žádné duplicity)
# nebo ručně přes „Run workflow".
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag release, pro který sestavit a doplnit balíčky (např. v1.2.3)'
        required: true

permissions: {}

jobs:
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [macos-15, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate release notes
        shell: bash
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            { echo "## Změny od $PREV"; echo ""; git log "$PREV"..HEAD --no-merges --pretty="- %s"; } > release-notes.txt
          else
            git log -1 --pretty=%B > release-notes.txt
          fi
          cat release-notes.txt

      - name: Build & publish (macOS podepsaný+notarizovaný / Windows)
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            npx electron-builder --win --publish always -c.releaseInfo.releaseNotesFile=release-notes.txt
          else
            npx electron-builder --mac --publish always -c.releaseInfo.releaseNotesFile=release-notes.txt
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Přílohy k Release nahrává gh, ne electron-builder: ten do vydání staršího než 2 hodiny nepřiloží nic
      # („existing release published more than 2 hours ago“), takže při opakovaném běhu chyběl Intel .dmg
      # i latest-mac.yml (v1.2.3, 6. 11. 2026). Nahraje jen to, co v Release ještě není — už zveřejněnou
      # přílohu nepřepisuje, aby komu se stáhla, platil kontrolní součet; výměna = smazat ji ručně.
      - name: Doplnit chybějící přílohy k Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "Neplatný tag: $TAG"; exit 1; }
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "LexisLocal $TAG" --notes-file release-notes.txt
          gh release view "$TAG" --json assets --jq '.assets[].name' > prilohy.txt
          for f in dist/*.dmg dist/*.dmg.blockmap dist/*.exe dist/*.exe.blockmap dist/latest*.yml; do
            [ -f "$f" ] || continue
            z=$(basename "$f")
            if grep -Fxq "$z" prilohy.txt; then
              echo "už v Release: $z"
            else
              echo "nahrávám: $z"
              gh release upload "$TAG" "$f"
            fi
          done
