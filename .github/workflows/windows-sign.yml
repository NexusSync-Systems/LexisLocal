# Akce připnuté na commit (SHA), instalace z lockfile (npm ci), token jen pro čtení, kde nejde o vydání
# (review 2, skupina 3 — dodavatelský řetězec). Novou verzi akce: git ls-remote --tags <repo> → SHA.
name: Windows build + Azure Artifact Signing

# Sestaví Windows instalátor (Electron / electron-builder → NSIS, x64) a podepíše
# ho přes Azure Artifact Signing (Trusted Signing) s ověřením přes OIDC (žádný
# certifikát ani .pfx v repu — službě stačí federované přihlášení azure/login).
#
# Spouští se ručně (Run workflow). Ostrý release pro macOS+Windows dělá
# samostatný release.yml; tenhle workflow řeší jen podepsaný Windows artefakt.
on:
  workflow_dispatch:

permissions: {}

jobs:
  build-sign-windows:
    # Azure Artifact Signing action běží POUZE na Windows (používá nativní nástroje).
    runs-on: windows-latest
    permissions:
      id-token: write    # NUTNÉ: bez toho azure/login nedostane federovaný OIDC token
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: 'npm'

      # Stejně jako v release.yml — LexisLocal vyžaduje --legacy-peer-deps.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Build BEZ publikování — nejdřív podepíšeme, teprve pak vydáváme.
      # NSIS instalátor vznikne jako:  dist\LexisLocal Setup <verze>.exe
      - name: Build Windows installer (unsigned)
        run: npx electron-builder --win --publish never

      - name: List build output
        shell: pwsh
        run: Get-ChildItem -Path dist -Filter *.exe | Select-Object Name, Length

      # Federované přihlášení do Azure (OIDC). Bez secretů s klíčem — jen ID.
      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Podpis NSIS instalátoru. Timestamping je POVINNÝ (certifikáty platí ~3 dny,
      # bez časového razítka podpis po vypršení přestane platit).
      - name: Sign Windows installer (Azure Artifact Signing)
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://neu.codesigning.azure.net/
          signing-account-name: nexusstack-signing
          certificate-profile-name: nexusstack-public
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload signed installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LexisLocal-windows-signed
          path: dist\*.exe
          if-no-files-found: error
