# Balíček LexisLocalu pro Mac (Apple Silicon) bez gitu a bez instalace Node.js — pilot „jen cloud“.
# Obsah: aplikace (backend), produkční závislosti sestavené na macOS arm64, vlastní Node.js 22 (oficiální, ověřený
# SHA-256), skripty scripts/mac. Výstup: lexislocal-macos-arm64.tar.gz + .sha256 jako příloha GitHub Release
# (stejný tag jako .dmg z release.yml) + atestace původu (instalace ji ověří: scripts/mac/instaluj-balicek.sh).
#
# Bezpečnost (revize 2. 11. 2026): sestavení (npm ci, testy = cizí kód) běží jen s právem ČÍST repo a bez uloženého
# tokenu; právo zapisovat do release má jen malý job, který nic z npm nespouští. Akce připnuté na SHA.
name: Balíček pro Mac (pilot)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag release, ke kterému balíček přiložit (např. v1.2.1)'
        required: true
      bez_prilohy:
        description: 'Jen sestavit a ověřit, k Release nic nepřikládat (zkouška workflow)'
        type: boolean
        default: false

permissions: {}

jobs:
  sestaveni:
    runs-on: macos-15   # Apple Silicon (arm64)
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      NODE_MAJOR: '22'
    steps:
      - name: Kontrola tagu a architektury
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "Neplatný tag: $TAG"; exit 1; }
          test "$(uname -m)" = "arm64"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      # Bez cache npm záměrně (sestavení z čistého lockfile). Pozn.: setup-node od v5 zapne cache samo,
      # jen když je v package.json pole packageManager — to projekt nemá; kdyby se přidalo, dát sem
      # package-manager-cache: false.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Testy
        run: |
          npm ci --no-audit --no-fund
          npx jest --silent

      - name: Produkční závislosti
        run: |
          rm -rf node_modules
          npm ci --omit=dev --no-audit --no-fund

      - name: Node.js (oficiální binárka, ověřený SHA-256)
        run: |
          BASE="https://nodejs.org/dist/latest-v${NODE_MAJOR}.x"
          curl -fsSLO "$BASE/SHASUMS256.txt"
          FILE=$(grep -oE "node-v[0-9.]+-darwin-arm64\.tar\.gz" SHASUMS256.txt | head -1)
          curl -fsSLO "$BASE/$FILE"
          grep " $FILE\$" SHASUMS256.txt | shasum -a 256 -c -
          mkdir -p node-rt && tar -xzf "$FILE" -C node-rt --strip-components 1
          node-rt/bin/node -v

      - name: Sestavení balíčku
        run: |
          mkdir -p out/lexislocal
          cp -R backend package.json package-lock.json node_modules out/lexislocal/
          rm -rf out/lexislocal/backend/tests out/lexislocal/backend/eval
          mkdir -p out/lexislocal/scripts && cp -R scripts/mac out/lexislocal/scripts/
          mkdir -p out/lexislocal/docs && cp docs/PILOT_CLOUDSHELL.md docs/REZIM_JEN_CLOUD.md out/lexislocal/docs/
          mkdir -p out/lexislocal/node && cp -R node-rt/bin node-rt/lib node-rt/LICENSE out/lexislocal/node/
          { echo "$TAG"; echo "commit $(git rev-parse --short HEAD)"; echo "sestaveno $(date -u +%Y-%m-%dT%H:%MZ)"; echo "node $(node-rt/bin/node -v)"; } > out/lexislocal/VERSION
          (cd out/lexislocal && node/bin/node -e "require('./backend/lib/env_load'); require('./backend/lib/rerank_service'); require('./backend/lib/local_embed'); console.log('moduly OK')")
          tar -czf lexislocal-macos-arm64.tar.gz -C out lexislocal
          shasum -a 256 lexislocal-macos-arm64.tar.gz > lexislocal-macos-arm64.tar.gz.sha256
          ls -lh lexislocal-macos-arm64.tar.gz; cat lexislocal-macos-arm64.tar.gz.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: balicek
          path: |
            lexislocal-macos-arm64.tar.gz
            lexislocal-macos-arm64.tar.gz.sha256
          retention-days: 3

  zverejneni:
    needs: sestaveni
    runs-on: ubuntu-latest
    permissions:
      contents: write        # příloha k release
      id-token: write        # atestace původu (Sigstore)
      attestations: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: balicek

      - name: Kontrolní součet
        run: shasum -a 256 -c lexislocal-macos-arm64.tar.gz.sha256

      # Od v4 je to jen obal nad actions/attest (vstupy stejné); nové workflowy mají brát actions/attest
      # napřímo. Posunuto z v2.4.0, protože ta si uvnitř připínala akce na Node 20.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: lexislocal-macos-arm64.tar.gz

      # Při zkoušce workflow (bez_prilohy) se přeskočí, aby se nepřepsala už zveřejněná příloha;
      # kontrolní součet i atestace původu proběhnou, takže se ověří celý zbytek běhu.
      - name: Příloha k release
        if: ${{ !inputs.bez_prilohy }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "Neplatný tag: $TAG"; exit 1; }
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "LexisLocal $TAG" --notes "Balíček pro Mac (Apple Silicon): scripts/mac/instaluj-balicek.sh"
          gh release upload "$TAG" lexislocal-macos-arm64.tar.gz lexislocal-macos-arm64.tar.gz.sha256 --clobber
