# Akce připnuté na commit (SHA), instalace z lockfile (npm ci), token jen pro čtení, kde nejde o vydání
# (review 2, skupina 3 — dodavatelský řetězec). Novou verzi akce: git ls-remote --tags <repo> → SHA.
name: Test signing
#
# NEFUNKČNÍ, dokud se nedokončí nastavení Azure Trusted Signing (stav 7. 11. 2026).
# Běh 42386250740 spadl po 14 s na kroku „Azure login“ („Not all values are present.
# Ensure 'client-id' and 'tenant-id' are supplied“) — tři tajné hodnoty, které tenhle
# workflow potřebuje, v repozitáři ani v organizaci NexusSync-Systems neexistují:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Chybí k nim registrace aplikace v Entra ID a federované přihlašovací údaje pro
# tenhle repozitář (subject repo:NexusSync-Systems/LexisLocal:ref:refs/heads/main)
# a účet nexusstack-signing s profilem nexusstack-public. Nastavuje Zdeněk —
# registrace, oprávnění a placené služby si dělá sám.
# Celý postup krok za krokem: docs/AZURE_PODEPISOVANI_WINDOWS.md
on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  sign:
    runs-on: windows-latest
    steps:
      - name: Vyrobit testovaci exe
        run: Copy-Item C:\Windows\System32\notepad.exe test.exe

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://neu.codesigning.azure.net/
          signing-account-name: nexusstack-signing
          certificate-profile-name: nexusstack-public
          files: ${{ github.workspace }}\test.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify
        run: signtool verify /pa /v test.exe
